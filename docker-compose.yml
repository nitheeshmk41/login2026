services:
  db:
    image: postgres:15-alpine
    container_name: login2026_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: login2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d login2026"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: login2026_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      USE_SQLITE: "false"
      FRONTEND_URL: https://login.psgtech.ac.in
      CLIENT_URL: https://login.psgtech.ac.in
      APP_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/login2026
      LOCAL_DATABASE_URL: postgresql://postgres:postgres@db:5432/login2026
      NEON_DATABASE_URL: postgresql://neondb_owner:npg_1zF9ySCxZfAv@ep-small-waterfall-axaac8kn-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      JWT_SECRET: super_secret_jwt_key_login_2026
      SESSION_SECRET: super_secret_session_key_login_2026
    env_file:
      - ./.env
    networks:
      - default
      - npm_default

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
        VITE_API_URL: https://login.psgtech.ac.in
    container_name: login2026_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:5173"
    networks:
      - default
      - npm_default

networks:
  default:
  npm_default:
    external: true
    name: npm_default

volumes:
  pgdata:
